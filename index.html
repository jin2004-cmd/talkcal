<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f172a" />
<title>TalkCal · 说一句，排好你的日程</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- 顶部栏 -->
<header class="app-header">
  <div class="header-left">
    <h1 id="monthTitle">--</h1>
    <button id="todayBtn" class="btn-ghost">今天</button>
  </div>
  <div class="header-right">
    <button id="prevMonth" class="btn-ghost" aria-label="上一月">‹</button>
    <button id="nextMonth" class="btn-ghost" aria-label="下一月">›</button>
  </div>
</header>

<!-- [V2.1-04] 今日议程条 -->
<div id="todayStrip" class="today-strip"></div>

<!-- 主视图区 -->
<main id="views">

  <!-- 视图 1: 日历 -->
  <section class="view active" id="view-calendar">
    <div class="weekday-row">
      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
    </div>
    <div id="calendarGrid" class="calendar-grid"></div>
    <div class="agenda-panel">
      <h2 id="agendaTitle">今天</h2>
      <ul id="agendaList" class="agenda-list"></ul>
      <div id="agendaEmpty" class="empty-hint">这一天还没有安排，在下方说一句吧。</div>
    </div>
  </section>

  <!-- 视图 2: 日程概览 -->
  <section class="view" id="view-upcoming">
    <h2 class="view-title">接下来 7 天</h2>
    <ul id="upcomingList" class="upcoming-list"></ul>
    <div id="upcomingEmpty" class="empty-hint">未来 7 天暂无安排。</div>
  </section>

  <!-- 视图 3: 个人中心 -->
  <section class="view" id="view-profile">
    <h2 class="view-title">个人中心</h2>
    <div class="stat-card">
      <div class="stat"><span id="statTotal">0</span><label>累计事项</label></div>
      <div class="stat"><span id="statDone">0</span><label>已完成</label></div>
      <div class="stat"><span id="statStreak">0</span><label>连续记录</label></div>
    </div>
    <div class="profile-row"><span>登录账号</span><strong id="profileEmail">未登录（本地模式）</strong></div>
    <div class="profile-row"><span>已连设备</span><strong id="profileDevices">0</strong></div>
    <button id="exportBtn" class="btn-primary block">导出 JSON 备份</button>
    <button id="exportIcsBtn" class="btn-primary block">📅 导出 .ics（手机日历同步提醒）</button>
    <button id="importBtn" class="btn-ghost block">导入 JSON</button>
    <input type="file" id="importFile" accept="application/json" hidden />
  </section>

  <!-- 视图 4: 设置中心 -->
  <section class="view" id="view-settings">
    <h2 class="view-title">设置</h2>

    <details class="setting-group" open>
      <summary>LLM 接口（OpenAI 兼容）</summary>
      <label class="field">Base URL
        <input id="setLlmBase" placeholder="https://api.deepseek.com/v1" />
      </label>
      <label class="field">API Key
        <input id="setLlmKey" type="password" placeholder="sk-...（留空走 Mock）" />
      </label>
      <label class="field">模型名
        <input id="setLlmModel" placeholder="deepseek-chat" />
      </label>
    </details>

    <details class="setting-group">
      <summary>Supabase 云同步（可选）</summary>
      <label class="field">Project URL
        <input id="setSbUrl" placeholder="https://xxxx.supabase.co" />
      </label>
      <label class="field">anon key
        <input id="setSbKey" type="password" placeholder="公钥，可暴露在前端" />
      </label>
      <button id="sbConnectBtn" class="btn-primary block">连接 / 登录</button>
      <button id="sbLogoutBtn" class="btn-ghost block">退出登录</button>
    </details>

    <details class="setting-group" open>
      <summary>🎨 外观与皮肤</summary>
      <label class="field">皮肤
        <select id="setSkin">
          <option value="light">☀️ 白昼（浅色）</option>
          <option value="dark">🌙 暗夜（深色）</option>
          <option value="aurora">✨ 极光（紫青渐变）</option>
        </select>
      </label>
    </details>

    <details class="setting-group">
      <summary>提醒与质量门</summary>
      <label class="field">提前提醒（分钟）
        <input id="setLeadMin" type="number" value="10" min="0" max="120" />
      </label>
      <label class="field">Eval 通过阈值（0-10）
        <input id="setEvalThreshold" type="number" value="7" min="0" max="10" />
      </label>
      <label class="row">
        <input type="checkbox" id="setDark" /> 跟随系统深色
      </label>
    </details>

    <button id="saveSettingsBtn" class="btn-primary block">保存设置</button>
    <p id="settingsSaved" class="saved-hint" hidden>已保存 ✔</p>
  </section>
</main>

<!-- 对话坞（仅日历 Tab 显示） -->
<div id="chatDock" class="chat-dock">
  <div id="chatLog" class="chat-log" aria-live="polite"></div>
  <!-- [V2.2] 示例快捷指令 -->
  <div id="quickChips" class="quick-chips">
    <button type="button" class="chip" data-q="后天下午3点交论文，很急">📝 后天3点交论文，很急</button>
    <button type="button" class="chip" data-q="我这周忙不忙">📆 我这周忙不忙</button>
    <button type="button" class="chip" data-q="取消明天的组会">❌ 取消明天组会</button>
  </div>
  <form id="chatForm" class="chat-form">
    <input id="chatInput" placeholder='说一句，比如"后天下午3点交论文，很急"' autocomplete="off" />
    <button type="submit" class="btn-primary">发送</button>
  </form>
</div>

<!-- 底部 Tab -->
<nav class="tab-bar">
  <button class="tab active" data-view="calendar">📅<span>日历</span></button>
  <button class="tab" data-view="upcoming">📆<span>概览</span></button>
  <button class="tab" data-view="profile">👤<span>我的</span></button>
  <button class="tab" data-view="settings">⚙️<span>设置</span></button>
</nav>

<script src="js/priority.js"></script>
<script src="js/anim.js"></script>
<script src="js/confetti.js"></script>
<script src="js/toast.js"></script>
<script src="js/ics.js"></script>
<script src="js/eval.js"></script>
<script src="js/llm.js"></script>
<script src="js/store.js"></script>
<script src="js/push.js"></script>
<script src="js/calendar.js"></script>
<script src="js/chat.js"></script>
<script src="js/app.js"></script>
</body>
</html>
